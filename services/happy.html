<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy | ZEZA Media</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ffcc00,#ff7b00);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.container{
    max-width:800px;
    padding:40px;
}

h1{
    font-size:5rem;
    margin-bottom:20px;
    animation:bounce 2s infinite;
}

p{
    font-size:1.3rem;
    margin-bottom:30px;
    line-height:1.7;
}

.btn{
    display:inline-block;
    background:#fff;
    color:#ff7b00;
    padding:15px 35px;
    border-radius:50px;
    font-weight:bold;
    text-decoration:none;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

@keyframes bounce{
    0%,20%,50%,80%,100%{
        transform:translateY(0);
    }
    40%{
        transform:translateY(-15px);
    }
    60%{
        transform:translateY(-8px);
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>😊 Happy!</h1>

    <p>
        Welcome to the happiest page on ZEZA Media.
        Today is a great day to learn, create, innovate,
        and make an impact.
    </p>

    <p>
        Keep smiling, keep growing, and keep building
        amazing things.
    </p>

    /="btn">Back to Home</a>
</div>

</body>
</html>
